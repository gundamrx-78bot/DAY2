<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>연결 확인</title>
<style>
  :root { --bg: #f6f8fb; --card: #fff; --text: #1d2733; --line: #c9d3de; --ok: #1f9d55; --bad: #d14343; --accent: #2f7fd1; }
  @media (prefers-color-scheme: dark) { :root { --bg: #11161c; --card: #1a222b; --text: #e8eef4; --line: #34424f; --ok: #4cc38a; --bad: #f07070; --accent: #5aa3f0; } }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; background: var(--bg); color: var(--text); padding: 24px 16px; }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 14px; }
  .row { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; gap: 10px; }
  .ok { color: var(--ok); font-weight: bold; } .bad { color: var(--bad); font-weight: bold; }
  button { font: inherit; padding: 9px 16px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; margin: 6px 8px 0 0; }
  a { color: var(--accent); }
  p { margin-top: 14px; }
</style>
</head>
<body>
<main>
  <h1>🔌 연결 확인</h1>
  <div class="row"><span>FastAPI 서버 <small>(/health)</small></span><span id="h">확인 중…</span></div>
  <div class="row"><span>Supabase <small>(/db-check)</small></span><span id="d">확인 중…</span></div>
  <button id="re">🔄 다시 확인</button>
  <p><a href="structure.html">구조 설명 보러 가기 →</a></p>
</main>
<script>
  // 배포 후에는 Railway 주소로 바꾸면 돼요
  var API = "http://127.0.0.1:8000";
  function show(id, ok, text) { var e = document.getElementById(id); e.textContent = text; e.className = ok ? "ok" : "bad"; }
  function check(path, id, okText) {
    document.getElementById(id).textContent = "확인 중…"; document.getElementById(id).className = "";
    fetch(API + path).then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function () { show(id, true, "✅ " + okText); })
      .catch(function () { show(id, false, "❌ 연결 안 됨"); });
  }
  function all() { check("/health", "h", "정상"); check("/db-check", "d", "연결됨"); }
  document.getElementById("re").onclick = all; all();
</script>
</body>
</html>
